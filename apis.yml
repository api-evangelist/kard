aid: kard
name: Kard
description: Kard is an independent commerce media network and card-linked-offers (CLO) rewards platform. Its Rewards API
  lets fintechs, banks, and card issuers enroll cardholders, submit transactions for closed-loop offer matching, surface personalized
  offers and redemption locations, run attributions and placements, and receive earned-reward webhook notifications — powering
  embedded loyalty and cashback programs without building the matching infrastructure. Marketers use the same network to reach
  47M+ cardholders with performance-based, transaction-driven offers.

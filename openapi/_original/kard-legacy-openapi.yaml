components:
  schemas:
    type_transactions:TransactionStatus:
      type: string
      enum:
        - APPROVED
        - SETTLED
        - REVERSED
        - RETURNED
        - DECLINED
      title: TransactionStatus
    type_commons:State:
      type: string
      enum:
        - AL
        - AK
        - AS
        - AZ
        - AR
        - CA
        - CO
        - CT
        - DE
        - DC
        - FM
        - FL
        - GA
        - GU
        - HI
        - ID
        - IL
        - IN
        - IA
        - KS
        - KY
        - LA
        - ME
        - MH
        - MD
        - MA
        - MI
        - MN
        - MS
        - MO
        - MT
        - NE
        - NV
        - NH
        - NJ
        - NM
        - NY
        - NC
        - ND
        - MP
        - OH
        - OK
        - OR
        - PW
        - PA
        - PR
        - RI
        - SC
        - SD
        - TN
        - TX
        - UT
        - VT
        - VI
        - VA
        - WA
        - WV
        - WI
        - WY
      title: State
    type_transactions:IncomingTransactionRequest:
      type: object
      properties:
        transactionId:
          type: string
          description: Transaction ID in issuer's system
        referringPartnerUserId:
          type: string
          description: Referring partner user ID from issuer associated with transaction
        amount:
          type: integer
          description: Transaction amount in cents
        status:
          $ref: '#/components/schemas/type_transactions:TransactionStatus'
          description: Transaction status
        currency:
          type: string
          description: Currency of transaction
        description:
          type: string
          description: Description of transaction - usually includes merchant and other key details on transaction
        description2:
          type: string
          description: Description2 of transaction — usually includes other merchant identifying information
        mcc:
          type: string
          description: >-
            Merchant Category Code (usually a 4-digit numerical number). <b>Note, this field is REQUIRED for SOME
            national offers. We HIGHLY RECOMMEND sending this field as it will be required in the near future.</b>
        coreProviderId:
          type: string
          description: Name of processor associated with transaction
        transactionDate:
          type: string
          format: date-time
          description: >-
            Timestamp for <b>REVERSED, RETURNED, DECLINED</b> transaction events; <b>REQUIRED</b> for transactions with
            <b>REVERSED, RETURNED, DECLINED</b> status. Date string should be in ISO format
            i.e.`'YYYY-MM-DDThh:mm:ss.sTZD'` where TZD = time zone designator (Z or +hh:mm or -hh:mm) i.e.
            `1994-11-05T08:15:30-05:00` OR `1994-11-05T08:15:30Z`
        authorizationDate:
          type: string
          format: date-time
          description: >-
            Timestamp for <b>APPROVED</b> transaction event; <b>REQUIRED</b> for transactions with <b>APPROVED</b>
            status, and <b>HIGHLY RECOMMENDED</b> to include for transactions with a <b>SETTLED</b> status. Date string
            should be in ISO format i.e.`'YYYY-MM-DDThh:mm:ss.sTZD'` where TZD = time zone designator (Z or +hh:mm or
            -hh:mm) i.e. `1994-11-05T08:15:30-05:00 OR 1994-11-05T08:15:30Z`
        settledDate:
          type: string
          format: date-time
          description: >-
            Timestamp for <b>SETTLED</b> transaction event, <b>REQUIRED</b> for transactions with <b>SETTLED</b> status.
            Date string should be in ISO format i.e.`'YYYY-MM-DDThh:mm:ss.sTZD'` where TZD = time zone designator (Z or
            +hh:mm or -hh:mm) i.e. `1994-11-05T08:15:30-05:00` OR `1994-11-05T08:15:30Z`
        merchantId:
          type: string
          description: >-
            Acquirer Merchant Identification Number (MID) — usually a 15 digit numerical identifier code. <b>Note, this
            field is REQUIRED for local offers. We HIGHLY RECOMMEND sending this field as it will be required in the
            near future.</b>
        merchantStoreId:
          type: string
          description: Merchant store ID where transaction originated from
        cardPresence:
          type: string
          description: Whether card was present at time of transaction
        merchantName:
          type: string
          description: Merchant name associated with transaction
        merchantAddrCity:
          type: string
          description: >-
            Merchant address city associated with transaction. <b>We HIGHLY RECOMMEND sending this field as it may be
            required in the near future.</b>
        merchantAddrState:
          $ref: '#/components/schemas/type_commons:State'
          description: >-
            Merchant address state associated with transaction. <b>We HIGHLY RECOMMEND sending this field as it may be
            required in the near future.</b>
        merchantAddrZipcode:
          type: string
          description: >-
            Merchant address zip code associated with transaction. <b>We HIGHLY RECOMMEND sending this field as it may
            be required in the near future.</b>
        merchantAddrCountry:
          type: string
          description: >-
            Merchant address country associated with transaction. <b>We HIGHLY RECOMMEND sending this field as it may be
            required in the near future.</b>
        merchantAddrStreet:
          type: string
          description: >-
            Merchant street address associated with transaction. <b>We HIGHLY RECOMMEND sending this field as it may be
            required in the near future.</b>
        merchantLat:
          type: string
          description: >-
            Merchant latitude geocoordinate associated with transaction. <b>We HIGHLY RECOMMEND sending this field as it
            may be required in the near future.</b>
        merchantLong:
          type: string
          description: >-
            Merchant longitude geocoordinate associated with transaction. <b>We HIGHLY RECOMMEND sending this field as
            it may be required in the near future.</b>
        panEntryMode:
          type: string
          description: PAN entry mode (usually a 2 digit numeric code)
        cardBIN:
          type: string
          description: >-
            Bank identification number (BIN). Must be a valid BIN of 6 digits. If over 6 digits, please send first 6.
            <b>Note, this field is REQUIRED for matching purposes.</b>
        cardLastFour:
          type: string
          description: Card last four digits. <b>Note, this field is REQUIRED for matching purposes.</b>
        googleId:
          type: string
          description: Google Id
        authorizationCode:
          type: string
          description: Transaction approval code
        retrievalReferenceNumber:
          type: string
          description: Retrieval Reference Number
        systemTraceAuditNumber:
          type: string
          description: System Trace Audit Number
        acquirerReferenceNumber:
          type: string
          description: Acquirer Reference Number
        isDeposit:
          type: boolean
          description: Transaction is a deposit
      required:
        - transactionId
        - referringPartnerUserId
        - amount
        - status
        - currency
        - description
      title: IncomingTransactionRequest
    type_transactions:CreateIncomingTransactionRequestBody:
      type: array
      items:
        $ref: '#/components/schemas/type_transactions:IncomingTransactionRequest'
      title: CreateIncomingTransactionRequestBody
    type_commons:UnauthorizedErrorBody:
      type: object
      properties:
        message:
          type: string
      required:
        - message
      title: UnauthorizedErrorBody
    type_commons:RequestValidationErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: string
      required:
        - errors
      title: RequestValidationErrorResponse
    type_commons:InvalidRequestUnion:
      oneOf:
        - $ref: '#/components/schemas/type_commons:RequestValidationErrorResponse'
        - type: string
      title: InvalidRequestUnion
    type_transactions:CreateAuditRequestBody:
      type: object
      properties:
        transactionId:
          type: string
          description: Transaction ID from issuer to audit
        auditCode:
          type: integer
          description: |-
            Audit Code - Enum. Please submit the code that is most relevant to your audit request.
              <ul>
                <li>`3005` : Customer is claiming cashback is incorrect - INCORRECT CASHBACK CLAIM</li>
                <li>`3006` : Transaction is missing the cashback award - MISSING CASHBACK AWARD</li>
                <li>`8001` : Other - check audit description</li>
              </ul>
        merchantName:
          type: string
          description: Merchant name related to the transaction audit
        auditDescription:
          type: string
          description: Audit Description. Please provide more details around the audit
        preferredContactEmail:
          type: string
          description: Preferred contact email to message to as audit is reviewed
        issuer:
          type: string
          description: Issuer name
        transactionAmountInCents:
          type: integer
          description: Transaction amount in cents
        referringPartnerUserId:
          type: string
          description: Referring partner user ID associated with the transaction to audit
        merchantId:
          type: string
          description: Related merchant ID in Kard's system associated to the transaction audit
        submitterName:
          type: string
          description: Submitter name
      required:
        - transactionId
        - auditCode
        - merchantName
        - auditDescription
        - preferredContactEmail
        - issuer
      title: CreateAuditRequestBody
    type_commons:MongoId:
      type: string
      description: The unique identifier for a document in the database
      title: MongoId
    type_transactions:AuditStatus:
      type: string
      enum:
        - NEW
        - IN_PROGRESS
        - CLOSED
      title: AuditStatus
    type_transactions:CreateAuditResponse:
      type: object
      properties:
        _id:
          $ref: '#/components/schemas/type_commons:MongoId'
          description: Audit Request ID
        transactionId:
          type: string
          description: Cardlinked Transaction ID
        auditCode:
          type: integer
          description: |-
            Audit Code - Enum 
              <ul>
                <li>`3005` : Customer is claiming cashback is incorrect - INCORRECT CASHBACK CLAIM</li>
                <li>`3006` : Transaction is missing the cashback award - MISSING CASHBACK AWARD</li>
                <li>`8001` : Other - check audit description</li>
              </ul>
        merchantName:
          type: string
          description: Merchant name
        auditDescription:
          type: string
          description: Audit Description
        preferredContactEmail:
          type: string
          description: Preferred Contact Email
        transactionAmountInCents:
          type: integer
          description: Transaction amount in cents
        referringPartnerUserId:
          type: string
          description: User ID
        merchantId:
          $ref: '#/components/schemas/type_commons:MongoId'
          description: Internal Kard Merchant ID
        submitterName:
          type: string
          description: Submitter Name
        status:
          $ref: '#/components/schemas/type_transactions:AuditStatus'
          description: Status of Audit
      required:
        - _id
        - transactionId
        - auditCode
        - merchantName
        - auditDescription
        - preferredContactEmail
        - status
      title: CreateAuditResponse
    type_transactions:GetAuditByIdResponse:
      type: object
      properties:
        _id:
          $ref: '#/components/schemas/type_commons:MongoId'
          description: The audit ID provided by Kard's system
        transactionId:
          type: string
          description: Transaction ID associated with audit
        auditCode:
          type: integer
          description: |-
            Audit Code - Enum. Code to define audit.
              <ul>
                <li>`3005` : Customer is claiming cashback is incorrect - INCORRECT CASHBACK CLAIM</li>
                <li>`3006` : Transaction is missing the cashback award - MISSING CASHBACK AWARD</li>
                <li>`8001` : Other - check audit description</li>
              </ul>
        merchantName:
          type: string
          description: Merchant name related to the transaction audit
        auditDescription:
          type: string
          description: Audit Description. More details around the audit
        preferredContactEmail:
          type: string
          description: Preferred contact email to message to as audit is reviewed
        transactionAmountInCents:
          type: integer
          description: Transaction amount in cents
        referringPartnerUserId:
          type: string
          description: Referring partner user ID associated with the transaction to audit
        merchantId:
          $ref: '#/components/schemas/type_commons:MongoId'
          description: Related merchant ID in Kard's system associated to the transaction audit
        submitterName:
          type: string
          description: Submitter name
        status:
          $ref: '#/components/schemas/type_transactions:AuditStatus'
          description: Status of audit
        resolutionCode:
          type: integer
          description: |-
            Resolution Code - Enum. field is available when audit is status CLOSED.
            <ul>
              <li>`5001` : Transaction will be deleted</li>
              <li>`5002` : Settlement amount will be adjusted</li>
              <li>`5003` : Return amount will be adjusted</li>
              <li>`5004` : Reward dispute resolved</li>
              <li>`5005` : Transaction will be marked for writeoff</li>
              <li>`5006` : Transaction will be marked as rejected</li>
              <li>`5007` : Transaction will be resent through webhook</li>
              <li>`5008` : Transaction will be resent through daily file</li>
              <li>`5009` : No change needed</li>
              <li>`9001` : Ineligible item in purchase</li>
              <li>`9002` : Return was made</li>
              <li>`9003` : User ineligible for offer (usually because of participation through another program)</li>
              <li>`9004` : Redemption limit hit (if offer has a set number of redemptions and it isn't handled programmatically)</li>
              <li>`9005` : Transaction not captured</li>
            </ul>
        resolutionDescription:
          type: string
          description: Resolution Description; field is available when audit is status CLOSED
        resolutionTimeStamp:
          type: string
          format: date-time
          description: >-
            Resolution timestamp of when the audit was marked as status CLOSED in ISO format; available when audit is
            closed.
      required:
        - _id
        - transactionId
        - auditCode
        - merchantName
        - auditDescription
        - preferredContactEmail
        - status
      title: GetAuditByIdResponse

openapi: 3.1.0
info:
  title: API Reference
  version: 1.0.0
paths:
  /transactions/incoming:
    post:
      operationId: create-incoming-transaction
      summary: Create Incoming Transaction
      description: >-
        Call this endpoint to send all incoming transactions made by all enrolled users in your rewards program. These
        incoming transactions will be processed and matched by the Kard system. Learn more about the [Transaction CLO
        Matching](https://github.com/kard-financial/kard-postman#c-transaction-clo-matching) flow here.<br/>

        <b>Required scopes:</b> `transaction:write`
      tags:
        - transactions
      parameters:
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Response with status 201
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_commons:InvalidRequestUnion'
        '401':
          description: Error response with status 401
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_commons:UnauthorizedErrorBody'
        '500':
          description: Error response with status 500
          content:
            application/json:
              schema:
                type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/type_transactions:CreateIncomingTransactionRequestBody'
  /transactions/audit:
    post:
      operationId: create-audit
      summary: Create Audit
      description: >-
        Call this endpoint to request that a particular transaction be audited further by the Kard system, in the event
        of a missing cashback claim, incorrect cashback amount claim or other mis-match claims.<br/>

        <b>Required scopes:</b> `audit:write`
      tags:
        - transactions
      parameters:
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Response with status 201
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_transactions:CreateAuditResponse'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_commons:InvalidRequestUnion'
        '401':
          description: Error response with status 401
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_commons:UnauthorizedErrorBody'
        '409':
          description: Error response with status 409
          content:
            application/json:
              schema:
                type: string
        '500':
          description: Error response with status 500
          content:
            application/json:
              schema:
                type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/type_transactions:CreateAuditRequestBody'
  /transactions/audit/{id}:
    get:
      operationId: get-audit-by-id
      summary: Get Audit Status
      description: >-
        Call this endpoint to retrieve an update on the status of a created transaction audit. Note, the resolutionCode,
        resolutionDescription and resolutionTimeStamp will not be available until the audit has a “CLOSED” status
        signifying its resolution. <br/>

        <b>Required scopes:</b> `audit:read`
      tags:
        - transactions
      parameters:
        - name: id
          in: path
          description: The audit ID provided by Kard's system
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_transactions:GetAuditByIdResponse'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_commons:InvalidRequestUnion'
        '401':
          description: Error response with status 401
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_commons:UnauthorizedErrorBody'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                type: string
        '500':
          description: Error response with status 500
          content:
            application/json:
              schema:
                type: string
  /users/users:
    post:
      operationId: create-user
      summary: Create User
      description: >-
        Call this endpoint to enroll a specified user into your rewards program. Learn more about the [Enrolling
        Users](https://github.com/kard-financial/kard-postman#a-cardholders) flow based on your use case here.<br/>

        <b>Required scopes:</b> `user:write`
      tags:
        - users
      parameters:
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Response with status 201
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_commons:InvalidRequestUnion'
        '401':
          description: Error response with status 401
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_commons:UnauthorizedErrorBody'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                type: string
        '409':
          description: Error response with status 409
          content:
            application/json:
              schema:
                type: string
        '500':
          description: Error response with status 500
          content:
            application/json:
              schema:
                type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/type_users:CreateUserRequestBody'
  /users/users/{id}/cards:
    post:
      operationId: create-user-card
      summary: Create User Card
      description: >-
        Call this endpoint to create a card that a specified user enrolled in rewards will use to make purchases and
        earn rewards.<br/>

        <b>Required scopes:</b> `user:write`
      tags:
        - users
      parameters:
        - name: id
          in: path
          description: Referring partner user ID from issuer that specifies user
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Response with status 201
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_users:CreateUserCardResponse'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_commons:InvalidRequestUnion'
        '401':
          description: Error response with status 401
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_commons:UnauthorizedErrorBody'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                type: string
        '409':
          description: Error response with status 409
          content:
            application/json:
              schema:
                type: string
        '500':
          description: Error response with status 500
          content:
            application/json:
              schema:
                type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/type_users:CreateUserCardRequestBody'
  /users/users/{id}:
    put:
      operationId: update-user
      summary: Update User
      description: >-
        Call this endpoint to update the details on a specified user. If you would like to add a card to a specified
        user, please refer to the [Create User Card endpoint](/legacy/api/users/create-user-card).<br/>

        <b>Required scopes:</b> `user:update`
      tags:
        - users
      parameters:
        - name: id
          in: path
          description: Referring partner user ID from issuer that specifies user
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_users:UpdateUserResponse'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_commons:InvalidRequestUnion'
        '401':
          description: Error response with status 401
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_commons:UnauthorizedErrorBody'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                type: string
        '500':
          description: Error response with status 500
          content:
            application/json:
              schema:
                type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/type_users:UserRequestBody'
    delete:
      operationId: delete-user-by-id
      summary: Delete User
      description: >-
        Call this endpoint to delete a specified enrolled user from the rewards program and Kard's system. Users can be
        re-enrolled into rewards by calling the [Create User](/legacy/api/users/create-user) endpoint using the same
        `referringPartnerUserId` from before. Deleting a user will remove all the user fields for that specific user
        from Kard’s system.<br/>

        <b>Required scopes:</b> `user:delete`
      tags:
        - users
      parameters:
        - name: id
          in: path
          description: Referring partner user ID from issuer that specifies user
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_commons:InvalidRequestUnion'
        '401':
          description: Error response with status 401
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_commons:UnauthorizedErrorBody'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                type: string
        '500':
          description: Error response with status 500
          content:
            application/json:
              schema:
                type: string
  /rewards/merchant/user/{referringPartnerUserId}:
    get:
      operationId: get-merchants-by-user
      summary: Get Eligible Merchants
      description: >-
        Retrieve national merchants data that a specified user has eligible national offers at. Call this endpoint to
        build out your [targeted offers UX
        experience](https://github.com/kard-financial/kard-postman?tab=readme-ov-file#b-targeted-offers). Local
        merchants and offers details can be found by calling the [Get Eligible
        Locations](/legacy/api/rewards/locations/get-locations-by-user) endpoint with the `includeLocal` query
        parameter.<br/>

        <b>Required scopes:</b> `rewards:read`
      tags:
        - rewards
      parameters:
        - name: referringPartnerUserId
          in: path
          description: Referring partner user ID from issuer that specifies user
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: Page number [>= 0], (default = 0)
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          description: Maximum number of merchants to be returned [1 - 200], (default = 200)
          required: false
          schema:
            type: integer
        - name: category
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/type_commons:CategoryOption'
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/type_rewards:MerchantWithAttribution'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_commons:InvalidRequestUnion'
        '401':
          description: Error response with status 401
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_commons:UnauthorizedErrorBody'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                type: string
        '500':
          description: Error response with status 500
          content:
            application/json:
              schema:
                type: string
  /rewards/merchant/{id}:
    get:
      operationId: get-merchant-by-id
      summary: Get Merchant by ID
      description: |-
        Retrieve merchant data for a specific Kard merchant ID.<br/>
        <b>Required scopes:</b> `rewards:read`
      tags:
        - rewards
      parameters:
        - name: id
          in: path
          description: The Kard merchant ID to query
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_rewards:GetMerchantByIdResponse'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_commons:InvalidRequestUnion'
        '401':
          description: Error response with status 401
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_commons:UnauthorizedErrorBody'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                type: string
        '500':
          description: Error response with status 500
          content:
            application/json:
              schema:
                type: string
  /rewards/merchant:
    get:
      operationId: get-merchants
      summary: Get Merchants
      description: >-
        Retrieve ALL national and local merchant data regardless of whether a user is eligible to see them. This
        endpoint is a legacy endpoint and will no longer be maintained soon. Instead, use [Get Eligible
        Merchants](/legacy/api/rewards/merchants/get-merchants-by-user) to retrieve national merchant data and build
        your [targeted offers UX
        experience](https://github.com/kard-financial/kard-postman?tab=readme-ov-file#b-targeted-offers). Local
        merchants and offers details can be found by calling the [Get Eligible
        Locations](/legacy/api/rewards/locations/get-locations-by-user) endpoint with the `includeLocal` query
        parameter.<br/>

        <b>Required scopes:</b> `rewards:read`
      tags:
        - rewards
      parameters:
        - name: page
          in: query
          description: Page number [>= 0], (default = 0)
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          description: Maximum number of merchants [1 - 200], (default = 200)
          required: false
          schema:
            type: integer
        - name: source
          in: query
          description: Merchant source
          required: false
          schema:
            $ref: '#/components/schemas/type_commons:Source'
        - name: category
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/type_commons:CategoryOption'
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/type_rewards:Merchant'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_commons:InvalidRequestUnion'
        '401':
          description: Error response with status 401
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_commons:UnauthorizedErrorBody'
        '500':
          description: Error response with status 500
          content:
            application/json:
              schema:
                type: string
  /rewards/merchant/offers/user/{referringPartnerUserId}:
    get:
      operationId: get-offers-by-user
      summary: Get Eligible Offers
      description: >-
        Retrieve national offers data that a specified user is eligible for. Call this endpoint to build out your
        [targeted offers UX
        experience](https://github.com/kard-financial/kard-postman?tab=readme-ov-file#b-targeted-offers). Local
        merchants and offers details can be found by calling the [Get Eligible
        Locations](/legacy/api/rewards/locations/get-locations-by-user) endpoint with the `includeLocal` query
        parameter.<br/>

        <b>Required scopes:</b> `rewards:read`
      tags:
        - rewards
      parameters:
        - name: referringPartnerUserId
          in: path
          description: Referring partner user ID from issuer that specifies user
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: Page number [>= 0], (default = 0)
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          description: Maximum number of offers to be returned [1 - 200], (default = 200)
          required: false
          schema:
            type: integer
        - name: merchantId
          in: query
          description: Merchant ID in Kard's system
          required: false
          schema:
            type: string
        - name: offerType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/type_commons:OfferType'
        - name: category
          in: query
          description: >-
            Category of merchant associated with offer. Please use URL Encode for non single word categories. (Food &
            Beverage should be Food%20%26%20Beverage)
          required: false
          schema:
            $ref: '#/components/schemas/type_commons:CategoryOption'
        - name: isTargeted
          in: query
          description: True returns targeted offers, false returns targeted and non-targeted offers
          required: false
          schema:
            type: boolean
        - name: startDateSort
          in: query
          description: Sort offer start dates chronologically (1 for ascending, -1 for descending)
          required: false
          schema:
            $ref: '#/components/schemas/type_commons:SortOptions'
        - name: expirationDateSort
          in: query
          description: Sort offer expiration dates chronologically (1 for ascending, -1 for descending)
          required: false
          schema:
            $ref: '#/components/schemas/type_commons:SortOptions'
        - name: merchantNameSort
          in: query
          description: Sort merchant names (1 for A-Z, -1 for Z-A)
          required: false
          schema:
            $ref: '#/components/schemas/type_commons:SortOptions'
        - name: supportedComponents
          in: query
          description: UI component types to include in the response.
          required: false
          schema:
            $ref: '#/components/schemas/type_rewards:ComponentType'
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/type_rewards:OfferWithAttribution'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_commons:InvalidRequestUnion'
        '401':
          description: Error response with status 401
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_commons:UnauthorizedErrorBody'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
                type: string
        '500':
          description: Error response with status 500
          content:
            application/json:
              schema:
                type: string
  /rewards/merchant/offers:
    get:
      operationId: get-offers
      summary: Get Offers
      description: >-
        Retrieve ALL national and local offer data regardless of whether a user is eligible to see them. This endpoint
        is a legacy endpoint and will no longer be maintained soon. Instead, use [Get Eligible
        Offers](/legacy/api/rewards/offers/get-offers-by-user) to retrieve national merchant data and build your
        [targeted offers UX
        experience](https://github.com/kard-financial/kard-postman?tab=readme-ov-file#b-targeted-offers). Local
        merchants and offers details can be found by calling the [Get Eligible
        Locations](/legacy/api/rewards/locations/get-locations-by-user) endpoint with the `includeLocal` query
        parameter.<br/>

        <b>Required scopes:</b> `rewards:read`
      tags:
        - rewards
      parameters:
        - name: page
          in: query
          description: Page number [>= 0], (default = 0)
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          description: Maximum number of offers [1 - 200], (default = 200)
          required: false
          schema:
            type: integer
        - name: source
          in: query
          description: Source of merchant associated with offer
          required: false
          schema:
            $ref: '#/components/schemas/type_commons:Source'
        - name: category
          in: query
          description: >-
            Category of merchant associated with offer. Please use URL Encode for non single word categories. (Food &
            Beverage should be Food%20%26%20Beverage)
          required: false
          schema:
            $ref: '#/components/schemas/type_commons:CategoryOption'
        - name: name
          in: query
          description: Name of offer
          required: false
          schema:
            type: string
        - name: offerType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/type_commons:OfferType'
        - name: merchantId
          in: query
          description: Merchant ID in Kard's system
          required: false
          schema:
            type: string
        - name: isTargeted
          in: query
          description: True returns targeted offers, false returns targeted and non-targeted offers
          required: false
          schema:
            type: boolean
        - name: startDateStart
          in: query
          description: Time in string format for offer startDate search (UTC)
          required: false
          schema:
            type: string
            format: date-time
        - name: startDateEnd
          in: query
          description: Time in string format for offer startDate search (UTC)
          required: false
          schema:
            type: string
            format: date-time
        - name: expirationDateStart
          in: query
          description: Time in string format for offer expirationDate search (UTC)
          required: false
          schema:
            type: string
            format: date-time
        - name: expirationDateEnd
          in: query
          description: Time in string format for offer expirationDate search (UTC)
          required: false
          schema:
            type: string
            format: date-time
        - name: startDateSort
          in: query
          description: Sort offer start dates chronologically (1 for ascending, -1 for descending)
          required: false
          schema:
            $ref: '#/components/schemas/type_commons:SortOptions'
        - name: expirationDateSort
          in: query
          description: Sort offer expiration dates chronologically (1 for ascending, -1 for descending)
          required: false
          schema:
            $ref: '#/components/schemas/type_commons:SortOptions'
        - name: merchantNameSort
          in: query
          description: Sort merchant names (1 for A-Z, -1 for Z-A)
          required: false
          schema:
            $ref: '#/components/schemas/type_commons:SortOptions'
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Response with status 200
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/type_rewards:Offer'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_commons:InvalidRequestUnion'
        '401':
          description: Error response with status 401
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_commons:UnauthorizedErrorBody'
        '500':
          description: Error response with status 500
          content:
            application/json:
              schema:
                type: string
  /rewards/merchant/locations/user/{referringPartnerUserId}:
    get:
      operationId: get-locations-by-user
      summary: Get Eligible Locations
      description: >-
        Retrieve national and local geographic locations data that a specified user has eligible in-store offers at. To
        include local merchant locations, include the `includeLocal` query parameter. Call this endpoint to build out
        your [targeted offers](https://github.com/kard-financial/kard-postman?tab=readme-ov-file#b-targeted-offers) and
        [map-specific UX experiences](https://github.com/kard-financial/kard-postman#c-discover-clos-near-you-map-view).
        Please note that Longitude and Latitude fields are prioritized over State, City and Zipcode.<br/>

        <b>Required scopes:</b> `rewards:read`
      tags:
        - rewards
      parameters:
        - name: referringPartnerUserId
          in: path
          description: Referring partner user ID from issuer that specifies user
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: Page number [>= 0], (default = 0)
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          description: Maximum number of locations to be returned [1 - 200], (default = 200)
          required: false
          schema:
            type: integer
        - name: locationNameSort
          in: query
          description: Sort location names (1 for A-Z, -1 for Z-A)
          required: false
          schema:

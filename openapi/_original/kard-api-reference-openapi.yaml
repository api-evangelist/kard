          description: Error response with status 500
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_commons:ErrorResponse'
      requestBody:
        description: Placement data for creation
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/type_organizations/placements:CreatePlacementRequestBody'
    get:
      operationId: list
      summary: List
      description: List placements belonging to the authenticated organization
      tags:
        - Organizations > Placements
      parameters:
        - name: organizationId
          in: path
          description: Unique identifier of the organization
          required: true
          schema:
            type: string
        - name: filter[type]
          in: query
          description: >-
            Filter by placement type (placement, placementPushNotification, placementEmail, placementBatchActivation, or
            placementGroup)
          required: false
          schema:
            $ref: '#/components/schemas/type_organizations/placements:PlacementTypeFilter'
        - name: filter[name]
          in: query
          description: Filter by exact placement name (unique within an organization per type)
          required: false
          schema:
            type: string
        - name: filter[contentStrategyId]
          in: query
          description: Filter by the ID of the content strategy linked to the placement
          required: false
          schema:
            type: string
        - name: include
          in: query
          description: >-
            CSV list of related resources to embed in the `included` array. Supported paths: `contentStrategy` (the
            direct content strategy of a non-batch placement), `slots` (the slot resources of a batch-activation or
            group placement), `slots.placement` (and the placement each slot references), and
            `slots.placement.contentStrategy` (and the content strategy of each referenced placement). Dotted paths
            implicitly include all intermediate resources.
          required: false
          schema:
            type: string
        - name: page[after]
          in: query
          description: Cursor value for the next page of results
          required: false
          schema:
            type: string
        - name: page[size]
          in: query
          description: Maximum number of records to return [1 - 200] (default = 200)
          required: false
          schema:
            type: integer
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Paginated list of placements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_organizations/placements:PlacementListResponse'
        '400':
          description: Error response with status 400

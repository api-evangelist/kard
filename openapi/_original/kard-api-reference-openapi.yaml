        - SC
        - SD
        - TN
        - TX
        - UT
        - VT
        - VI
        - VA
        - WA
        - WV
        - WI
        - WY
      title: States
    type_transactions:Merchant:
      type: object
      properties:
        id:
          type: string
          description: >-
            Acquirer Merchant Identification Number (MID) — usually a 15 digit numerical identifier code. <b>Note, this
            field is REQUIRED for local offers. We HIGHLY RECOMMEND sending this field as it will be required in the
            near future.</b>
        name:
          type: string
          description: Merchant name associated with transaction
        addrStreet:
          type: string
          description: Merchant street address associated with transaction.
        addrCity:
          type: string
          description: Merchant address city associated with transaction.
        addrState:
          $ref: '#/components/schemas/type_transactions:States'
          description: Merchant address state associated with transaction.
        addrZipcode:
          type: string
          description: Merchant address zip code associated with transaction.
        addrCountry:
          type: string
          description: Merchant address country associated with transaction.
        latitude:
          type: string
          description: Merchant latitude geocoordinate associated with transaction.
        longitude:
          type: string
          description: Merchant longitude geocoordinate associated with transaction.
        storeId:
          type: string
          description: Merchant store ID where transaction originated from
      required:
        - name
      title: Merchant
    type_transactions:DirectionType:
      type: string
      enum:
        - DEBIT
        - CREDIT
      title: DirectionType
    type_transactions:TransactionPaymentType:
      type: string
      enum:
        - CARD
      title: TransactionPaymentType
    type_commons:CardNetwork:
      type: string
      enum:
        - VISA
        - MASTERCARD
        - AMERICANEXPRESS
        - DISCOVER
      description: Supported card networks
      title: CardNetwork
    type_transactions:VisaMidDetails:
      type: object
      properties:
        vmid:
          type: string
          description: Visa Merchant ID (VMID) associated with the transaction
        vsid:
          type: string
          description: Visa Store ID (VSID) associated with the transaction
      required:
        - vmid
        - vsid
      title: VisaMidDetails
    type_transactions:ProcessorMid:
      oneOf:
        - type: object
          properties:
            processor:
              type: string
              enum:
                - VISA
              description: 'Discriminator value: VISA'
            mids:
              $ref: '#/components/schemas/type_transactions:VisaMidDetails'
              description: Merchant ID (MID) associated with the processor
          required:
            - processor
            - mids
      discriminator:
        propertyName: processor
      title: ProcessorMid
    type_transactions:TransactionsAttributes:
      type: object
      properties:
        userId:
          type: string
          description: The ID of the user as defined on the issuers system
        amount:
          type: integer
          description: Transaction amount in cents
        subtotal:
          type: integer
          description: The base amount in cents excluding additional charges (such as tips, taxes, and other fees).
        status:
          $ref: '#/components/schemas/type_transactions:TransactionStatus'
          description: Transaction status
        currency:
          type: string
          description: Currency of transaction
        description:
          type: string
          description: Description of transaction - usually includes merchant and other key details on transaction
        description2:
          type: string
          description: Description2 of transaction — usually includes other merchant identifying information
        mcc:
          type: string
          description: >-
            Merchant Category Code (usually a 4-digit numerical number). <b>Note, this field is REQUIRED for SOME
            national offers. We HIGHLY RECOMMEND sending this field as it will be required in the near future.</b>
        coreProviderId:
          type: string
          description: Name of processor associated with transaction
        transactionDate:
          type: string
          format: date-time
          description: >-
            Timestamp for <b>REVERSED, RETURNED, DECLINED</b> transaction events; <b>REQUIRED</b> for transactions with
            <b>REVERSED, RETURNED, DECLINED</b> status. Date string should be in ISO 8601 format
            i.e.`'YYYY-MM-DDThh:mm:ss.sTZD'` where TZD = time zone designator (Z or +hh:mm or -hh:mm) i.e.
            `1994-11-05T08:15:30-05:00` OR `1994-11-05T08:15:30Z`
        authorizationDate:
          type: string
          format: date-time
          description: >-
            Timestamp for <b>APPROVED</b> transaction event; <b>REQUIRED</b> for transactions with <b>APPROVED</b>
            status, and <b>HIGHLY RECOMMENDED</b> to include for transactions with a <b>SETTLED</b> status. Date string
            should be in ISO 8601 format i.e.`'YYYY-MM-DDThh:mm:ss.sTZD'` where TZD = time zone designator (Z or +hh:mm
            or -hh:mm) i.e. `1994-11-05T08:15:30-05:00 OR 1994-11-05T08:15:30Z`
        settledDate:
          type: string
          format: date-time
          description: >-
            Timestamp for <b>SETTLED</b> transaction event, <b>REQUIRED</b> for transactions with <b>SETTLED</b> status.
            Date string should be in ISO 8601 format i.e.`'YYYY-MM-DDThh:mm:ss.sTZD'` where TZD = time zone designator
            (Z or +hh:mm or -hh:mm) i.e. `1994-11-05T08:15:30-05:00` OR `1994-11-05T08:15:30Z`
        merchant:
          $ref: '#/components/schemas/type_transactions:Merchant'
          description: Merchant details
        cardPresence:
          type: string
          description: Whether card was present at time of transaction
        panEntryMode:
          type: string
          description: PAN entry mode
        cardBIN:
          type: string
          description: Bank identification number (BIN). Must be a valid BIN of 6 digits. If over 6 digits, please send first 6.
        cardLastFour:
          type: string
          description: Card last four digits.
        authorizationCode:
          type: string
          description: Transaction approval code
        retrievalReferenceNumber:
          type: string
          description: Retrieval Reference Number
        systemTraceAuditNumber:
          type: string
          description: System Trace Audit Number
        acquirerReferenceNumber:
          type: string
          description: Acquirer Reference Number
        direction:
          $ref: '#/components/schemas/type_transactions:DirectionType'
          description: The direction in which the funds flow - DEBIT or CREDIT
        paymentType:
          $ref: '#/components/schemas/type_transactions:TransactionPaymentType'
          description: The type of payment involved in the transaction.
        cardNetwork:
          $ref: '#/components/schemas/type_commons:CardNetwork'
          description: The card network associated with the transaction
        transactionId:
          type: string
          description: The transaction ID
        cardProductId:
          type: string
          description: The card product ID associated with the transaction
        userZipCode:
          type: string
          description: The zip code of the user who made the transaction
        processorMids:
          $ref: '#/components/schemas/type_transactions:ProcessorMid'
          description: Network specific merchant IDs (MIDs) associated with the transaction
        accountId:
          type: string
          description: An account identifier associated to transaction
      required:
        - userId
        - amount
        - status
        - currency
        - description
        - cardBIN
        - cardLastFour
        - direction
        - paymentType
        - transactionId
      title: TransactionsAttributes
    type_transactions:PaymentType:
      type: string
      enum:
        - CARD
        - CASH
        - UNKNOWN
      title: PaymentType
    type_transactions:ReceiptMediumType:
      type: string
      enum:
        - ELECTRONIC
        - PHYSICAL
      title: ReceiptMediumType
    type_transactions:MatchedTransactionsAttributes:
      type: object
      properties:
        userId:
          type: string
          description: The ID of the user as defined on the issuers system
        amount:
          type: integer
          description: Transaction amount in cents
        subtotal:
          type: integer
          description: The base amount in cents excluding additional charges (such as tips, taxes, and other fees).
        description:
          type: string
          description: Description of transaction - usually includes merchant and other key details on transaction
        authorizationDate:
          type: string
          format: date-time
          description: >-
            Timestamp for transaction event. Date string should be in ISO 8601 format i.e.`'YYYY-MM-DDThh:mm:ss.sTZD'`
            where TZD = time zone designator (Z or +hh:mm or -hh:mm) i.e. `1994-11-05T08:15:30-05:00 OR
            1994-11-05T08:15:30Z`
        matchedOfferId:
          type: string
          description: >-
            The ID of the Kard offer to which the transaction was matched. If this field is omitted, the transaction
            will be considered unmatched to any Kard offer. This field **must** be omitted when the `paymentType` is
            `UNKNOWN` and neither an orderId nor a `cardLastFour` is supplied.
        matchedLocationId:
          type: string
          description: >-
            The unique Kard location ID where the transaction took place. This field **must** be omitted  when
            `paymentType` is `UNKNOWN`.
        merchant:
          $ref: '#/components/schemas/type_transactions:Merchant'
          description: Merchant details
        paymentType:
          $ref: '#/components/schemas/type_transactions:PaymentType'
          description: The type of payment involved in the transaction.
        cardBIN:
          type: string
          description: >-
            Bank identification number (BIN). Must be a valid BIN of 6 digits. If over 6 digits, please send first 6.
            This field **must** be omitted when `paymentType` is `CASH` or `UNKNOWN`.
        cardLastFour:
          type: string
          description: >-
            Card last four digits. This field is **required** when `paymentType` is `CARD` and `matchedOfferId` is
            provided. It **must** be omitted when `paymentType` is `CASH`.
        authorizationCode:
          type: string
          description: Transaction approval code
        retrievalReferenceNumber:
          type: string
          description: Retrieval Reference Number
        systemTraceAuditNumber:
          type: string
          description: System Trace Audit Number
        acquirerReferenceNumber:
          type: string
          description: Acquirer Reference Number
        direction:
          $ref: '#/components/schemas/type_transactions:DirectionType'
          description: The direction in which the funds flow - DEBIT or CREDIT
        cardNetwork:
          $ref: '#/components/schemas/type_commons:CardNetwork'
          description: >-
            The card network associated with the transaction. This field **must** be omitted when `paymentType` is
            `CASH` or `UNKNOWN`.
        transactionId:
          type: string
          description: The transaction ID
        cardProductId:
          type: string
          description: >-
            The card product ID associated with the transaction. This field **must** be omitted when `paymentType` is
            `CASH` or `UNKNOWN`.
        orderId:
          type: string
          description: The unique identifier for an online order linked to this transaction.
        receiptMedium:
          $ref: '#/components/schemas/type_transactions:ReceiptMediumType'
          description: Indicates the format of the receipt from which the transaction is derived.
      required:
        - userId
        - amount
        - description
        - authorizationDate
        - paymentType
        - direction
        - transactionId
      title: MatchedTransactionsAttributes
    type_transactions:CoreTransactionAttributes:
      type: object
      properties:
        userId:
          type: string
          description: The ID of the user as defined on the issuers system
        transactionId:
          type: string
          description: The transaction ID from the core banking system
        amount:
          type: integer
          description: Transaction amount in cents
        currency:
          type: string
          description: Currency of transaction in ISO 4217 alpha-3 format
        description:
          type: string
          description: Description of transaction - usually includes merchant and other key details on transaction
        direction:
          $ref: '#/components/schemas/type_transactions:DirectionType'
          description: The direction in which the funds flow - DEBIT or CREDIT
        status:
          type: string
          enum:
            - SETTLED
          description: Transaction status (always SETTLED for core transactions)
        settledDate:
          type: string
          format: date-time
          description: >-
            Timestamp when transaction was settled. Date string should be in ISO 8601 format
            i.e.'YYYY-MM-DDThh:mm:ss.sTZD' where TZD = time zone designator (Z or +hh:mm or -hh:mm) i.e.
            1994-11-05T08:15:30-05:00 OR 1994-11-05T08:15:30Z
        authorizationDate:
          type: string
          format: date-time
          description: >-
            Timestamp for transaction authorization. Date string should be in ISO 8601 format
            i.e.'YYYY-MM-DDThh:mm:ss.sTZD' where TZD = time zone designator (Z or +hh:mm or -hh:mm) i.e.
            1994-11-05T08:15:30-05:00 OR 1994-11-05T08:15:30Z
        financialInstitutionName:
          type: string
          description: Deprecated. Use `financialInstitutionId` instead. Name of the financial institution.
        financialInstitutionId:
          type: string
          description: Unique identifier of the financial institution
        cardLastFours:
          type: array
          items:
            type: string
          description: >-
            Last four digits of the card(s) that may have been used for the transaction. When the issuer cannot
            determine which specific card was used, multiple values are provided as candidates.
      required:
        - userId
        - transactionId
        - amount
        - currency
        - description
        - direction
        - status
        - settledDate
        - authorizationDate
      title: CoreTransactionAttributes
    type_transactions:Transactions:
      oneOf:
        - type: object
          properties:
            type:
              type: string
              enum:
                - transaction
              description: 'Discriminator value: transaction'
            id:
              type: string
              description: >-
                Unique identifier for the transaction event. This <b>must</b> be unique for each distinct event sent to
                the API.
            attributes:
              $ref: '#/components/schemas/type_transactions:TransactionsAttributes'
          required:
            - type
            - id
            - attributes
        - type: object
          properties:
            type:
              type: string
              enum:
                - matchedTransaction
              description: 'Discriminator value: matchedTransaction'
            id:
              type: string
              description: >-
                Unique identifier for the transaction event. This <b>must</b> be unique for each distinct event sent to
                the API.
            attributes:
              $ref: '#/components/schemas/type_transactions:MatchedTransactionsAttributes'
          required:
            - type
            - id
            - attributes
        - type: object
          properties:
            type:
              type: string
              enum:
                - coreTransaction
              description: 'Discriminator value: coreTransaction'
            id:
              type: string
              description: >-
                Unique identifier for the transaction event. This <b>must</b> be unique for each distinct event sent to
                the API.
            attributes:
              $ref: '#/components/schemas/type_transactions:CoreTransactionAttributes'
          required:
            - type
            - id
            - attributes
      discriminator:
        propertyName: type
      title: Transactions
    type_transactions:TransactionsRequestBody:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/type_transactions:Transactions'
          description: |-
            Discriminated union representing the request body for submitting a transaction.
            Use `type` to distinguish between the two:
            - `transaction`: For transactions requiring processing and matching by the Kard system.
            - `matchedTransaction`: For pre-matched transactions that need validation on match by the Kard system.
            - `coreTransaction`: For transactions from core banking systems with limited card-level data.
      required:
        - data
      title: TransactionsRequestBody
    type_commons:ResourceType:
      type: string
      description: Type of document returned
      title: ResourceType
    type_commons:JobStatus:
      type: string
      enum:
        - queued
      description: Status of the job
      title: JobStatus
    type_commons:Job:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/type_commons:JobStatus'
        message:
          type: string
          description: Message regarding the status of the job request
      required:
        - status
        - message
      title: Job
    type_transactions:TransactionsResponseData:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/type_commons:ResourceType'
        id:
          type: string
          description: The request id of the pending job
        attributes:
          $ref: '#/components/schemas/type_commons:Job'
      required:
        - type
        - id
        - attributes
      title: TransactionsResponseData
    type_transactions:TransactionsResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/type_transactions:TransactionsResponseData'
      required:
        - data
      title: TransactionsResponse
    type_commons:ErrorSource:
      type: object
      properties:
        pointer:
          type: string
          description: A JSON pointer to the value in the request document that caused the error
        parameter:
          type: string
          description: A string indicating which URI query parameter caused the error
        header:
          type: string
          description: A string indicating the name of a single request header which caused the error
      title: ErrorSource
    type_commons:ErrorObject:
      type: object
      properties:
        status:
          type: string
          description: Status code returned from the request
        title:
          type: string
          description: Name of error
        detail:
          type: string
          description: Description of the specific occurance of the error
        source:
          $ref: '#/components/schemas/type_commons:ErrorSource'
          description: An object containing a reference to the primary source of the error
        id:
          type: string
          description: The id of the resource which caused the error. Always returned for multi-status errors.
      required:
        - status
        - title
        - detail
      title: ErrorObject
    type_transactions:TransactionsMultiResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/type_commons:ErrorObject'
        data:
          $ref: '#/components/schemas/type_transactions:TransactionsResponseData'
      required:
        - errors
        - data
      title: TransactionsMultiResponse
    type_commons:ErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/type_commons:ErrorObject'
      required:
        - errors
      title: ErrorResponse
    type_transactions:FileUploadType:
      type: string
      enum:
        - incomingTransactionsFile
        - historicalTransactionsFile
      description: >-
        Specifies the category of transaction file being uploaded. Use `incomingTransactionsFile` for new, real-time
        transactions that need to be processed and matched as they arrive. Use `historicalTransactionsFile` for
        historical transaction ingestion.
      title: FileUploadType
    type_transactions:CreateFileUploadAttributes:
      type: object
      properties:
        filename:
          type: string
          description: Name of the file to upload, including extension (e.g. "transaction_12345.jsonl")
      required:
        - filename
      title: CreateFileUploadAttributes
    type_transactions:CreateFileUploadData:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/type_transactions:FileUploadType'
        attributes:
          $ref: '#/components/schemas/type_transactions:CreateFileUploadAttributes'
      required:
        - type
        - attributes
      title: CreateFileUploadData
    type_transactions:CreateFileUploadRequestBody:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/type_transactions:CreateFileUploadData'
          description: List of file upload requests (1–10 items per request).
      required:
        - data
      title: CreateFileUploadRequestBody
    type_transactions:FileUploadUrlAttributes:
      type: object
      properties:
        url:
          type: string
          description: |-
            Presigned PUT URL for uploading the file directly to storage.
            Use HTTP PUT with binary body. Expires after 15 minutes.
        expiresIn:
          type: integer
          description: Time in seconds until the presigned URL expires (900)
      required:
        - url
        - expiresIn
      title: FileUploadUrlAttributes
    type_transactions:FileUploadUrlData:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/type_transactions:FileUploadType'
        id:
          type: string
          description: Upload session ID for traceability
        attributes:
          $ref: '#/components/schemas/type_transactions:FileUploadUrlAttributes'
      required:
        - type
        - id
        - attributes
      title: FileUploadUrlData
    type_transactions:CreateFileUploadUrlResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/type_transactions:FileUploadUrlData'
          description: List of created file upload sessions.
      required:
        - data
      title: CreateFileUploadUrlResponse
    type_transactions:AuditAttributes:
      type: object
      properties:
        auditCode:
          type: integer
          description: |-
            Audit Code - Enum. Please submit the code that is most relevant to your audit request.
                        <ul>
                          <li>`3005` : Customer is claiming cashback is incorrect - INCORRECT CASHBACK CLAIM</li>
                          <li>`3006` : Transaction is missing the cashback award - MISSING CASHBACK AWARD</li>
                          <li>`8001` : Other - check audit description</li>
                        </ul>
        merchantName:
          type: string
          description: Merchant name related to the transaction audit
        auditDescription:
          type: string
          description: Audit Description. Please provide more details around the audit
        transactionId:
          type: string
          description: Transaction ID from issuer to audit
      required:
        - auditCode
        - merchantName
        - auditDescription
        - transactionId
      title: AuditAttributes

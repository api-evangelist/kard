  /v2/issuers/{organizationId}/placements:
    post:
      operationId: create
      summary: Create
      description: >-
        Create a placement for the organization. Use type "placement" for standard placements (requires name and
        availableSlots), "placementPushNotification" for push-notification placements (requires name and cadence;
        availableSlots is automatically set to 1), "placementEmail" for email placements (requires name, cadence, and
        availableSlots), "placementBatchActivation" for batch-activation placements (requires name, refreshInterval, and
        slots), or "placementGroup" for group placements (requires name and slots).
      tags:
        - Organizations > Placements
      parameters:
        - name: organizationId
          in: path
          description: Unique identifier of the organization
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Created placement resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_organizations/placements:PlacementFormatUnion'
        '400':
          description: Error response with status 400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_commons:ErrorResponse'
        '401':
          description: Error response with status 401
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_commons:ErrorResponse'
        '403':
          description: Error response with status 403
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/type_commons:ErrorResponse'
        '404':
          description: Error response with status 404
          content:
            application/json:
              schema:
